<!DOCTYPE html>
<html lang="pt-BR" class="theme-vintage-sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Banners - Outro Brasileiro no D-Day</title>
  <meta name="description" content="Escolha entre mais de 2.500 banners profissionais para seu perfil.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/banner-gallery.css">
</head>
<body data-profile="outro-brasileiro">
  <!-- Header -->
  <header class="gallery-header">
    <div class="gallery-header-inner">
      <div class="gallery-header-left">
        <a href="profile-editor.html" class="gallery-back-link" id="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
          <span>Voltar</span>
        </a>
        <div class="gallery-header-divider"></div>
        <h1 class="gallery-title" id="gallery-title">Galeria de Banners</h1>
      </div>
      <div class="gallery-header-right">
        <div class="gallery-view-toggle">
          <button class="gallery-view-btn active" data-view="grid" title="Grade">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="7" height="7" x="3" y="3" rx="1"/>
              <rect width="7" height="7" x="14" y="3" rx="1"/>
              <rect width="7" height="7" x="14" y="14" rx="1"/>
              <rect width="7" height="7" x="3" y="14" rx="1"/>
            </svg>
          </button>
          <button class="gallery-view-btn" data-view="list" title="Lista">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" x2="21" y1="6" y2="6"/>
              <line x1="8" x2="21" y1="12" y2="12"/>
              <line x1="8" x2="21" y1="18" y2="18"/>
              <line x1="3" x2="3.01" y1="6" y2="6"/>
              <line x1="3" x2="3.01" y1="12" y2="12"/>
              <line x1="3" x2="3.01" y1="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Search Bar -->
    <div class="gallery-search-container">
      <div class="gallery-search">
        <svg class="gallery-search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="search-input" class="gallery-search-input" placeholder="Buscar categorias...">
        <button class="gallery-search-clear hidden" id="search-clear">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="gallery-main">
    <div class="gallery-content" id="gallery-content">
      <!-- Dynamic content -->
    </div>
  </main>

  <!-- Loading Indicator -->
  <div class="gallery-loading hidden" id="loading">
    <div class="gallery-spinner"></div>
    <span>Carregando...</span>
  </div>

  <script src="js/banner-gallery-data.js"></script>
  <script src="js/banner-gallery.js"></script>
</body>
</html>
