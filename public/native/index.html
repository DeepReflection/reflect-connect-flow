<!DOCTYPE html>
<html lang="pt-BR" class="theme-vintage-sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outro Brasileiro no D-Day</title>
  <meta name="description" content="Projeto dedicado à criação de conteúdos audiovisuais sobre a Segunda Guerra Mundial.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hero-layouts.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/blog.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-profile="default">
  <!-- Navigation Menu with integrated Theme Selector is created dynamically by JS -->
  
  <!-- Edit Profile Button -->
  <a href="profile-editor.html" class="edit-profile-btn" title="Editar Perfil">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </a>

  <!-- Particle Background -->
  <canvas id="particles-canvas"></canvas>

  <!-- Hero Section - Classic Layout -->
  <header id="hero" class="hero-section">
    <div class="hero-banner">
      <img id="hero-banner-img" src="assets/themes/vintage-sepia/images/banner.jpg" alt="Banner">
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-content">
      <div class="hero-flex">
        <div class="avatar-container">
          <div class="avatar-wrapper">
            <img id="profile-avatar" src="https://vortice-deep-reflection-production.s3.amazonaws.com/resources/286.png" alt="Avatar" class="avatar">
          </div>
          <div class="avatar-pulse"></div>
        </div>
        <div class="hero-info-card">
          <div class="hero-header">
            <h1 id="profile-name" class="hero-title"></h1>
            <button class="share-btn" id="share-btn" aria-label="Compartilhar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
            </button>
          </div>
          <p id="profile-description" class="hero-description"></p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="social" class="main-content">
    <!-- CTA Button - Links to chat page like React -->
    <a href="chat.html" class="cta-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
      </svg>
      Fale Comigo
    </a>

    <!-- Blog CTA Button -->
    <a href="blog.html" class="blog-cta-button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
      </svg>
      Visitar Blog
    </a>

    <!-- Dashboard Link -->
    <a href="dashboard.html" class="dashboard-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/>
        <path d="m19 9-5 5-4-4-3 3"/>
      </svg>
      Dashboard de Insights
    </a>

    <!-- Social Links -->
    <section class="social-links" id="social-links"></section>
  </main>

  <!-- Agenda Section -->
  <section id="agenda" class="section agenda-section">
    <div class="section-container">
      <div class="section-title-wrapper">
        <div class="section-header-content">
          <span class="section-subtitle" data-corporate="Próximos Eventos" data-executive="Calendário Executivo">Próximos Eventos</span>
          <h2 class="section-title">Agenda</h2>
        </div>
        <div class="section-title-decoration">
          <div class="section-title-line-left"></div>
          <div class="section-title-dot"></div>
          <div class="section-title-line-right"></div>
        </div>
      </div>
      <div class="events-grid" id="events-grid"></div>
    </div>
  </section>

  <!-- Products Section -->
  <section id="products" class="section products-section">
    <div class="section-container">
      <div class="section-title-wrapper">
        <div class="section-header-content">
          <span class="section-subtitle" data-corporate="Catálogo" data-executive="Materiais Premium">Materiais Exclusivos</span>
          <h2 class="section-title">Produtos</h2>
        </div>
        <div class="section-title-decoration">
          <div class="section-title-line-left"></div>
          <div class="section-title-dot"></div>
          <div class="section-title-line-right"></div>
        </div>
      </div>
      <div class="products-grid" id="products-grid"></div>
    </div>
  </section>

  <!-- Services Section -->
  <section class="section services-section">
    <div class="section-container">
      <div class="section-title-wrapper">
        <div class="section-header-content">
          <span class="section-subtitle" data-corporate="Ofertas" data-executive="Expertise">Soluções Profissionais</span>
          <h2 class="section-title">Serviços</h2>
        </div>
        <div class="section-title-decoration">
          <div class="section-title-line-left"></div>
          <div class="section-title-dot"></div>
          <div class="section-title-line-right"></div>
        </div>
      </div>
      <div class="services-grid" id="services-grid"></div>
    </div>
  </section>

  <!-- Blog Preview Section - Latest Posts -->
  <section class="section blog-preview-section">
    <div class="section-container">
      <div class="blog-preview-header">
        <div class="section-title-wrapper">
          <div class="section-header-content">
            <span class="section-subtitle">Artigos Recentes</span>
            <h2 class="section-title">Últimos do Blog</h2>
          </div>
          <div class="section-title-decoration">
            <div class="section-title-line-left"></div>
            <div class="section-title-dot"></div>
            <div class="section-title-line-right"></div>
          </div>
        </div>
        <a href="blog.html" class="blog-preview-see-all">
          Ver todos
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>
      <div class="blog-preview-grid" id="blog-preview-grid"></div>
    </div>
  </section>

  <!-- Reflections Section -->
  <section id="reflections" class="section reflections-section">
    <div class="section-container">
      <div class="section-title-wrapper">
        <div class="section-header-content">
          <span class="section-subtitle" data-corporate="Galeria de Líderes" data-executive="Galeria">Galeria de Líderes</span>
          <h2 class="section-title">Minhas Reflexões</h2>
        </div>
        <div class="section-title-decoration">
          <div class="section-title-line-left"></div>
          <div class="section-title-dot"></div>
          <div class="section-title-line-right"></div>
        </div>
      </div>
      <div class="reflections-grid" id="reflections-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <p></p>
    <p class="footer-subtitle"></p>
  </footer>

  <!-- Chatbot Button - Avatar style like React -->
  <button id="chatbot-btn" class="chatbot-btn" aria-label="Abrir chat">
    <img id="chatbot-avatar" src="https://vortice-deep-reflection-production.s3.amazonaws.com/resources/286.png" alt="Chat" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <!-- Chat Modal -->
  <div id="chat-modal" class="chat-modal hidden">
    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-header-info">
          <img id="chat-avatar" src="" alt="Avatar" class="chat-avatar">
          <div>
            <h3 id="chat-name"></h3>
            <span class="chat-status">Online</span>
          </div>
        </div>
        <button id="chat-close" class="chat-close-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-quick-actions" id="chat-quick-actions"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Digite sua mensagem..." class="chat-input">
        <button id="chat-send" class="chat-send-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/blog-data.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      new NavigationMenu();
    });
  </script>
</body>
</html>
